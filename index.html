<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis AI</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07121c;--panel:#0d1f2d;--line:#17384d;--cyan:#4fd1e8;--text:#d7eaf2;--dim:#7fa0b0;--user:#12354a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,sans-serif;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
h1{font:600 24px Rajdhani,sans-serif;letter-spacing:.06em;margin:0;color:var(--cyan)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 14px}
button:hover{border-color:var(--cyan)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.bot{background:var(--panel);border:1px solid var(--line);align-self:flex-start}
.me{background:var(--user);align-self:flex-end}
.note{color:var(--dim);text-align:center;font-size:14px;align-self:center}
form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
textarea,input{flex:1;font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:none}
#send{background:var(--cyan);color:#04202b;border-color:var(--cyan);font-weight:500}
</style>
</head>
<body>
<header>
  <h1>JARVIS</h1>
  <button id="keyBtn" type="button">Set API key</button>
</header>
<main id="log" aria-live="polite"></main>
<form id="form">
  <textarea id="input" rows="1" placeholder="Ask Jarvis anything" aria-label="Message"></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
// Change this if Groq retires the model name
const MODEL = "llama-3.3-70b-versatile";
const SYSTEM = "You are Jarvis, a calm, witty and helpful personal AI assistant. Keep replies short and clear. Address the user as Rekib.";

const log = document.getElementById("log");
const input = document.getElementById("input");
const history = [];

function getKey(){ try{ return localStorage.getItem("jarvis_groq_key") || ""; }catch(e){ return ""; } }
function setKey(k){ try{ localStorage.setItem("jarvis_groq_key", k); }catch(e){} }

function add(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function askKey(){
  const k = prompt("Paste your Groq API key (starts with gsk_). It is saved only in this browser.");
  if(k && k.trim()){ setKey(k.trim()); add("Key saved. I’m ready.", "note"); }
}

async function ask(text){
  if(!getKey()){ askKey(); if(!getKey()) return; }
  history.push({role:"user", content:text});
  const bubble = add("…", "bot");
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 60000);
  try{
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method:"POST",
      signal:ctl.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer " + getKey()},
      body:JSON.stringify({model:MODEL, messages:[{role:"system", content:SYSTEM}].concat(history)})
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data.error && data.error.message || "Request failed"); }
    const reply = data.choices && data.choices[0] && data.choices[0].message.content;
    if(!reply){ throw new Error("Empty reply. Try again."); }
    history.push({role:"assistant", content:reply});
    bubble.textContent = reply;
  }catch(err){
    history.pop();
    bubble.textContent = err.name === "AbortError"
      ? "No reply after 60 seconds. Check your internet and try again."
      : "Something went wrong: " + err.message;
  }finally{
    clearTimeout(timer);
  }
  log.scrollTop = log.scrollHeight;
}

document.getElementById("keyBtn").onclick = askKey;
document.getElementById("form").onsubmit = e => {
  e.preventDefault();
  const t = input.value.trim();
  if(!t) return;
  input.value = "";
  add(t, "me");
  ask(t);
};
input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); document.getElementById("form").requestSubmit(); }
});

add("Jarvis online. Tap “Set API key” once, then say hello.", "note");
</script>
</body>
</html>
